name: Weekly job scan

on:
  schedule:
    # Sunday ~07:00 Israel time (UTC+3 in summer) -- one automatic run/week to
    # keep API cost down. Any additional run in between is triggered by hand
    # (the dashboard's "run scan now" button, or workflow_dispatch below).
    - cron: "0 4 * * 0"
  workflow_dispatch: {}  # lets us trigger it manually from the Actions tab, any time, as an ad hoc run

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline.py
